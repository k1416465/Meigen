{% extends "base.html" %}
{% block title %}迷言｜クイズ{% endblock %}
{% block content %}
<section class="welcome-row"><div><h1>クイズ</h1></div></section>
<section class="quiz-wrap">
  <div id="quiz-select" class="quiz-card">
    <h2>クイズを選択</h2>
    <button class="quiz-choice" id="start-kobun" type="button" aria-expanded="false" aria-controls="quiz-settings">
      <span><strong>古文単語</strong><small>「わかる･読める･解ける Key Point 古文単語330」より出題</small></span>
    </button>
    <div id="quiz-settings" class="quiz-settings" hidden>
      <div class="quiz-setting-field">
        <label for="question-count">問題数</label>
        <input id="question-count" type="number" min="1" step="1" value="10" inputmode="numeric">
      </div>
      <fieldset class="quiz-range-field">
        <legend>出題範囲（問題番号）</legend>
        <input id="range-start" type="number" min="1" step="1" value="1" inputmode="numeric" aria-label="出題範囲の開始番号">
        <span>～</span>
        <input id="range-end" type="number" min="1" step="1" value="50" inputmode="numeric" aria-label="出題範囲の終了番号">
      </fieldset>
      <button class="quiz-next" id="begin-quiz">解く</button>
      <p id="quiz-settings-error" class="quiz-settings-error" role="alert" hidden></p>
    </div>
  </div>

  <div id="quiz-game" class="quiz-card" hidden>
    <div class="quiz-top">
      <span id="quiz-progress">第1問 / 全10問</span>
      <button type="button" class="quiz-back" id="quit-quiz">クイズ選択へ戻る</button>
    </div>
    <div class="quiz-word-area">
      <div class="quiz-meta"><span id="quiz-page" class="quiz-page"></span><span id="quiz-number" class="quiz-number"></span></div>
      <h2 id="quiz-word" class="quiz-word"></h2>
      <div id="quiz-reading" class="quiz-reading"></div>
    </div>
    <div id="quiz-options" class="quiz-options"></div>
    <button id="quiz-answer" class="quiz-next" disabled>解答</button>
    <button id="quiz-next" class="quiz-next" hidden>次の問題へ</button>
  </div>

  <div id="quiz-result" class="quiz-card" hidden>
    <h2>結果</h2><p id="quiz-score" class="quiz-score"></p>
    <div class="quiz-result-actions"><button class="quiz-next" id="retry-quiz">もう一度挑戦</button><button class="quiz-back quiz-return" id="return-select">クイズ選択へ戻る</button></div>
  </div>
</section>
<style>
.quiz-wrap{max-width:680px;margin:0 auto 32px}.quiz-wrap [hidden]{display:none!important}.quiz-card{background:var(--card-bg,#fff);border:1px solid var(--border-color,#ddd);border-radius:18px;padding:clamp(18px,4vw,28px);box-shadow:0 5px 18px #0000000a}
.quiz-card h2{margin:0 0 18px}.quiz-choice{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:18px;border:1px solid var(--border-color,#ddd);border-radius:13px;background:transparent;color:inherit;cursor:pointer}.quiz-choice small{display:block;margin-top:5px;opacity:.7}
.quiz-settings{display:grid;grid-template-columns:1fr;gap:14px;margin-top:16px;padding:16px;border:1px solid var(--border-color,#ddd);border-radius:13px}.quiz-settings label,.quiz-range-field legend{font-weight:700}.quiz-setting-field{display:grid;gap:7px}.quiz-settings input{width:100%;min-width:0;box-sizing:border-box;padding:11px 12px;border:1px solid var(--border-color,#ccc);border-radius:10px;background:var(--card-bg,#fff);color:inherit;font-size:1rem}.quiz-range-field{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;margin:0;padding:0;border:0}.quiz-range-field legend{grid-column:1/-1;margin-bottom:7px}.quiz-range-field label{font-size:.9rem}.quiz-settings-error{margin:0;color:#dc2626;font-weight:700}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700}.quiz-back{border:0;border-radius:10px;background:#077AE3;color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}.quiz-word-area{text-align:center;margin:24px 0}.quiz-meta{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:8px}.quiz-page,.quiz-number{font-weight:700;color:var(--muted-color,#777)}.quiz-word{font-size:clamp(2rem,8vw,3rem);margin:0!important}.quiz-reading{min-height:1.2em;margin-top:1px;font-size:1rem;line-height:1.2;opacity:.75}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.quiz-option{min-height:58px;padding:12px;border:1px solid var(--border-color,#ccc);border-radius:12px;background:transparent;color:inherit;font-size:1rem;text-align:left;cursor:pointer}.quiz-option.selected{border:2px solid #077AE3;background:#077AE318}.quiz-option:disabled{opacity:1;cursor:default}.quiz-option.correct{border:2px solid #16a34a;background:#16a34a18}.quiz-option.wrong{border:2px solid #dc2626;background:#dc262618}
.quiz-next{width:100%;padding:13px;border:0;border-radius:12px;background:#077AE3;color:white;font-weight:700;font-size:1rem;cursor:pointer;margin-top:8px}.quiz-next:disabled{opacity:.4;cursor:not-allowed}.quiz-score{text-align:center;font-size:1.6rem;font-weight:800;margin:28px 0}.quiz-result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}.quiz-result-actions button{width:100%;height:48px;min-height:48px;margin:0;display:flex;align-items:center;justify-content:center;box-sizing:border-box}.quiz-return{margin-top:0}
@media(max-width:520px){.quiz-options{grid-template-columns:1fr}.quiz-option{min-height:52px}.quiz-card{padding:17px}.quiz-top{align-items:flex-start}.quiz-back{padding:9px 10px;font-size:.88rem}.quiz-result-actions{grid-template-columns:1fr}.quiz-result-actions button{height:48px;min-height:48px}}
/* 結果画面の2つのボタン：角丸・文字サイズ・高さを統一 */
.quiz-result-actions button{height:48px;min-height:48px;padding:12px 14px;border-radius:12px;font-size:1rem;font-weight:700;line-height:1.2;box-sizing:border-box;} 

/* クイズ画面のダークモード対応 */
html.dark .quiz-card,
body.dark .quiz-card,
body[data-theme="dark"] .quiz-card,
html[data-theme="dark"] .quiz-card {
  --quiz-surface: #1f2937;
  --quiz-border: #374151;
  --quiz-text: #f3f4f6;
  --quiz-muted: #aab4c3;
  background: var(--quiz-surface);
  border-color: var(--quiz-border);
  color: var(--quiz-text);
}
html.dark .quiz-settings,
body.dark .quiz-settings,
body[data-theme="dark"] .quiz-settings,
html[data-theme="dark"] .quiz-settings,
html.dark .quiz-choice,
body.dark .quiz-choice,
body[data-theme="dark"] .quiz-choice,
html[data-theme="dark"] .quiz-choice,
html.dark .quiz-option,
body.dark .quiz-option,
body[data-theme="dark"] .quiz-option,
html[data-theme="dark"] .quiz-option {
  border-color: var(--quiz-border);
  color: var(--quiz-text);
}
html.dark .quiz-settings input,
body.dark .quiz-settings input,
body[data-theme="dark"] .quiz-settings input,
html[data-theme="dark"] .quiz-settings input {
  color-scheme: dark;
  background: #111827;
  border-color: #4b5563;
  color: #f9fafb;
}
html.dark .quiz-page,
html.dark .quiz-number,
body.dark .quiz-page,
body.dark .quiz-number,
body[data-theme="dark"] .quiz-page,
body[data-theme="dark"] .quiz-number,
html[data-theme="dark"] .quiz-page,
html[data-theme="dark"] .quiz-number {
  color: var(--quiz-muted);
}
html.dark .quiz-option.selected,
body.dark .quiz-option.selected,
body[data-theme="dark"] .quiz-option.selected,
html[data-theme="dark"] .quiz-option.selected {
  background: #077AE326;
  border-color: #3b9cff;
}
html.dark .quiz-option.correct,
body.dark .quiz-option.correct,
body[data-theme="dark"] .quiz-option.correct,
html[data-theme="dark"] .quiz-option.correct {
  background: #16a34a26;
  border-color: #22c55e;
}
html.dark .quiz-option.wrong,
body.dark .quiz-option.wrong,
body[data-theme="dark"] .quiz-option.wrong,
html[data-theme="dark"] .quiz-option.wrong {
  background: #dc262626;
  border-color: #ef4444;
}
html.dark .quiz-settings-error,
body.dark .quiz-settings-error,
body[data-theme="dark"] .quiz-settings-error,
html[data-theme="dark"] .quiz-settings-error {
  color: #fca5a5;
}

</style>
<script>
(() => {
 const entries = {{ quiz_data|tojson }};
 const $ = id => document.getElementById(id);
 const select=$('quiz-select'), game=$('quiz-game'), result=$('quiz-result');
 let questions=[], index=0, score=0, selectedChoice=null, answered=false;
 const shuffle=a=>{const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;};
 // 問題番号の範囲に含まれる「単語」を対象にする。同じ番号の別単語も別レコード。
 function getValidEntries(rangeStart,rangeEnd){
   return entries.filter(e=>e&&typeof e.word==='string'&&e.word.trim()&&Array.isArray(e.translations)&&e.translations.length&&Number(e.number)>=rangeStart&&Number(e.number)<=rangeEnd);
 }
 // 問題数の上限は、対象単語に登録された訳語の総数。
 function getTranslationCount(rangeStart,rangeEnd){
   return getValidEntries(rangeStart,rangeEnd).reduce((total,e)=>total+e.translations.length,0);
 }
 function updateQuestionCountLimit(){
   const first=Number($('range-start').value), last=Number($('range-end').value);
   const max=Number.isInteger(first)&&Number.isInteger(last)&&first>=1&&last>=first?getTranslationCount(first,last):0;
   $('question-count').max=String(Math.max(1,max));
   if(max>0&&Number($('question-count').value)>max)$('question-count').value=String(max);
 }
 function makeQuestions(count,rangeStart,rangeEnd){
   const valid=getValidEntries(rangeStart,rangeEnd);
   // 1訳語につき1問。問題番号が同じでも単語レコードは統合しない。
   const candidates=valid.flatMap(entry=>entry.translations.map(correct=>({entry,correct})));
   const pool=valid.flatMap(entry=>entry.translations.map(translation=>({entry,translation})));
   const chosen=shuffle(candidates).slice(0,Math.min(count,candidates.length));
   return chosen.map(({entry,correct})=>{
     const distractors=[];
     shuffle(pool).forEach(item=>{
       // 同じ単語に属する別訳語は誤答候補にしない。
       if(item.entry!==entry&&item.translation!==correct&&distractors.length<3&&!distractors.some(x=>x.translation===item.translation))distractors.push(item);
     });
     if(distractors.length<3)return null;
     return {word:entry.word,number:entry.number,reading:entry.reading||'',page:entry.page,correct,options:shuffle([correct,...distractors.map(x=>x.translation)])};
   }).filter(Boolean);
 }
 function showQuestion(){
   if(index>=questions.length){showResult();return;}
   answered=false;selectedChoice=null;$('quiz-answer').hidden=false;$('quiz-answer').disabled=true;$('quiz-next').hidden=true;
   const q=questions[index];$('quiz-progress').textContent=`第${index+1}問 / 全${questions.length}問`;$('quiz-word').textContent=q.word;
   $('quiz-reading').textContent=q.reading||'';$('quiz-page').textContent=q.page!==null&&q.page!==undefined?`P${q.page}`:'';$('quiz-number').textContent=`問題番号:${q.number||''}`;
   const box=$('quiz-options');box.innerHTML='';
   q.options.forEach((choice,i)=>{const b=document.createElement('button');b.type='button';b.className='quiz-option';b.textContent=`${['①','②','③','④'][i]} ${choice}`;b.addEventListener('click',()=>selectOption(choice,b));box.appendChild(b);});
 }
 function selectOption(choice,button){if(answered)return;selectedChoice=choice;[...$('quiz-options').children].forEach(b=>b.classList.toggle('selected',b===button));$('quiz-answer').disabled=false;}
 function answer(){if(answered||selectedChoice===null)return;answered=true;const q=questions[index];
   [...$('quiz-options').children].forEach(b=>{b.disabled=true;const value=b.textContent.slice(2).trim();if(value===q.correct)b.classList.add('correct');if(value===selectedChoice&&selectedChoice!==q.correct)b.classList.add('wrong');});
   if(selectedChoice===q.correct)score++;
   $('quiz-answer').hidden=true;$('quiz-next').hidden=false;$('quiz-next').textContent=index===questions.length-1?'結果を見る':'次の問題へ';
 }
 function start(){
   const count=Number($('question-count').value), first=Number($('range-start').value), last=Number($('range-end').value);
   const error=$('quiz-settings-error');error.hidden=true;
   if(!Number.isInteger(count)||count<1||!Number.isInteger(first)||!Number.isInteger(last)||first<1||last<first){error.textContent='問題数と出題範囲を正しく入力してください。';error.hidden=false;return;}
   const translationCount=getTranslationCount(first,last);
   if(count>translationCount){error.textContent=`問題数は、指定範囲内の訳語数（${translationCount}）以下にしてください。`;error.hidden=false;return;}
   questions=makeQuestions(count,first,last);if(!questions.length){error.textContent='指定した範囲に出題できる問題がありません。';error.hidden=false;return;}
   if(questions.length<count){error.textContent=`選択肢を4つ用意できる訳語が少ないため、${questions.length}問で出題します。`;error.hidden=false;}
   index=0;score=0;select.hidden=true;result.hidden=true;game.hidden=false;showQuestion();
 }
 function showResult(){game.hidden=true;result.hidden=false;$('quiz-score').textContent=`${questions.length}問中 ${score}問正解（${Math.round(score/questions.length*100)}%）`;}
 function back(){game.hidden=true;result.hidden=true;select.hidden=false;$('quiz-settings').hidden=true;}
 $('range-start').addEventListener('input',updateQuestionCountLimit);
 $('range-end').addEventListener('input',updateQuestionCountLimit);
 $('start-kobun').addEventListener('click',()=>{const opened=$('start-kobun').getAttribute('aria-expanded')==='true';$('start-kobun').setAttribute('aria-expanded',String(!opened));$('quiz-settings').hidden=opened;if(!opened)updateQuestionCountLimit();});$('begin-quiz').addEventListener('click',start);$('retry-quiz').addEventListener('click',start);$('return-select').addEventListener('click',back);$('quit-quiz').addEventListener('click',back);$('quiz-answer').addEventListener('click',answer);$('quiz-next').addEventListener('click',()=>{index++;showQuestion();});
})();
</script>
{% endblock %}
