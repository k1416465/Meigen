{% extends "base.html" %}
{% block title %}迷言｜管理者用ページ
<style>
.admin-menu {
  width: 100%;
  min-width: 0;
}
.admin-menu > a.card {
  box-sizing: border-box;
  min-width: 0;
  overflow-wrap: anywhere;
  transition: transform .15s ease, box-shadow .15s ease;
}
.admin-menu > a.card:active {
  transform: scale(.98);
}
@media (max-width: 640px) {
  .welcome-row {
    align-items: flex-start;
    gap: 12px;
  }
  .welcome-row > div {
    min-width: 0;
  }
  .welcome-row h1 {
    font-size: 1.45rem;
    line-height: 1.35;
  }
  .welcome-row > a.back-link {
    flex: 0 0 auto;
    font-size: 12px;
    padding: 8px 10px;
    white-space: nowrap;
  }
  .admin-menu {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 10px !important;
  }
  .admin-menu > a.card {
    min-height: 104px !important;
    padding: 14px 8px !important;
    border-radius: 13px;
  }
  .admin-menu > a.card strong {
    font-size: 1.05rem !important;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }
  .admin-menu > a.card[href*="form_admin"] strong {
    font-size: .95rem !important;
  }
  body main.page form[action*="logout"] {
    margin-top: 14px !important;
  }
  body main.page form[action*="logout"] button {
    width: 100%;
    min-height: 44px;
  }
}
@media (max-width: 360px) {
  .admin-menu {
    grid-template-columns: minmax(0, 1fr) !important;
  }
  .admin-menu > a.card {
    min-height: 76px !important;
  }
}
</style>
{% endblock %}
{% block content %}
<section class="welcome-row">
  <div><h1>管理者用ページ</h1><p>管理する項目を選択してください。</p></div>
  <a class="back-link" href="{{ url_for('home') }}">ホームへ戻る</a>
</section>
<div class="admin-menu" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;">
  <a class="card" href="{{ url_for('special_schedule') }}" style="display:flex; align-items:center; justify-content:center; min-height:130px; padding:24px; text-decoration:none; text-align:center;">
    <strong style="font-size:1.5rem;">時間割</strong>
  </a>
  <a class="card" href="{{ url_for('stamp_admin') }}" style="display:flex; align-items:center; justify-content:center; min-height:130px; padding:24px; text-decoration:none; text-align:center;">
    <strong style="font-size:1.5rem;">スタンプ</strong>
  </a>
  <a class="card" href="{{ url_for('recording_admin') }}" style="display:flex; align-items:center; justify-content:center; min-height:130px; padding:24px; text-decoration:none; text-align:center;">
    <strong style="font-size:1.5rem;">録音</strong>
  </a>
  <a class="card" href="{{ url_for('form_admin') }}" style="display:flex; align-items:center; justify-content:center; min-height:130px; padding:24px; text-decoration:none; text-align:center;">
    <strong style="font-size:1.5rem;">アンケート管理</strong>
  </a>
  <a class="card" href="{{ url_for('analytics_page') }}" style="display:flex; align-items:center; justify-content:center; min-height:130px; padding:24px; text-decoration:none; text-align:center;">
    <strong style="font-size:1.5rem;">アクセス解析</strong>
  </a>
</div>
<form method="post" action="{{ url_for('recording_admin_logout') }}" style="margin-top:20px;">
  <button class="secondary-button" type="submit">管理者ログアウト</button>
</form>
