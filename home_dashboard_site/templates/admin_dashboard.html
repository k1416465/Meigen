{% extends "base.html" %}
{% block title %}迷言｜管理者用ページ{% endblock %}
{% block content %}
<style>
.admin-menu {
  width: 100%;
  min-width: 0;
}
.admin-menu > a.card {
  box-sizing: border-box;
  min-width: 0;
  overflow-wrap: anywhere;
  transition: transform .15s ease, box-shadow .15s ease;
}
.admin-menu > a.card:active {
  transform: scale(.98);
}
.admin-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.admin-header-actions form {
  margin: 0;
}
@media (max-width: 640px) {
  .welcome-row {
    align-items: flex-start;
    gap: 12px;
  }
  .welcome-row > div:first-child {
    min-width: 0;
  }
  .welcome-row h1 {
    font-size: 1.45rem;
    line-height: 1.35;
  }
  .admin-header-actions {
    width: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 8px;
  }
  .admin-header-actions .back-link,
  .admin-header-actions button {
    box-sizing: border-box;
    width: 100%;
    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 6px;
    font-size: 12px;
    line-height: 1.35;
    text-align: center;
    white-space: normal;
  }
  .admin-menu {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 10px !important;
  }
  .admin-menu > a.card {
    min-height: 104px !important;
    padding: 14px 8px !important;
    border-radius: 13px;
  }
  .admin-menu > a.card strong {
    font-size: 1.05rem !important;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }
  .admin-menu > a.card[href*="form_admin"] strong {
    font-size: .95rem !important;
  }
}
@media (max-width: 360px) {
  .admin-menu {
    grid-template-columns: minmax(0, 1fr) !important;
  }
  .admin-menu > a.card {
    min-height: 76px !important;
  }
}
</style>
<style>

/* 管理者用ページ・アクセス解析 共通操作ボタン */
.admin-common-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  flex-wrap: wrap;
}
.admin-common-form {
  display: flex;
  margin: 0;
}
.admin-common-button {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 190px;
  min-width: 0;
  min-height: 44px;
  margin: 0;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--surface);
  color: var(--muted);
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
  text-decoration: none;
  white-space: normal;
  overflow-wrap: anywhere;
  cursor: pointer;
}
.admin-common-button:hover {
  filter: brightness(.97);
}
.admin-reset-form {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  margin: 20px 0 8px;
}
.admin-reset-form .admin-common-button {
  flex: 0 0 190px;
}
@media (max-width: 640px) {
  .welcome-row {
    align-items: flex-start !important;
    flex-direction: column !important;
    gap: 12px !important;
  }
  .welcome-row > div:first-child {
    width: 100%;
    min-width: 0;
  }
  .welcome-row h1 {
    font-size: 1.45rem;
    line-height: 1.35;
  }
  .admin-common-actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: stretch;
    justify-content: stretch;
    width: 100%;
    gap: 8px;
  }
  .admin-common-actions > a,
  .admin-common-actions > form {
    display: flex;
    width: 100%;
    min-width: 0;
  }
  .admin-common-actions .admin-common-button {
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 8px 6px;
    font-size: 12px;
  }
  .admin-reset-form {
    justify-content: center;
    margin: 16px 0 8px !important;
  }
  .admin-reset-form .admin-common-button {
    width: 190px;
    max-width: 100%;
    min-height: 44px;
    flex: 0 1 190px;
  }
}

</style>

<section class="welcome-row">
  <div><h1>管理者用ページ</h1><p>管理する項目を選択してください。</p></div>
  <div class="admin-common-actions">
    <a class="admin-common-button" href="{{ url_for('home') }}">ホームへ戻る</a>
    <form class="admin-common-form" method="post" action="{{ url_for('recording_admin_logout') }}">
      <button class="admin-common-button" type="submit">管理者ログアウト</button>
    </form>
  </div>
</section>
<div class="admin-menu" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;">
  <a class="card" href="{{ url_for('special_schedule') }}" style="display:flex; align-items:center; justify-content:center; min-height:130px; padding:24px; text-decoration:none; text-align:center;">
    <strong style="font-size:1.5rem;">時間割</strong>
  </a>
  <a class="card" href="{{ url_for('stamp_admin') }}" style="display:flex; align-items:center; justify-content:center; min-height:130px; padding:24px; text-decoration:none; text-align:center;">
    <strong style="font-size:1.5rem;">スタンプ</strong>
  </a>
  <a class="card" href="{{ url_for('recording_admin') }}" style="display:flex; align-items:center; justify-content:center; min-height:130px; padding:24px; text-decoration:none; text-align:center;">
    <strong style="font-size:1.5rem;">録音</strong>
  </a>
  <a class="card" href="{{ url_for('form_admin') }}" style="display:flex; align-items:center; justify-content:center; min-height:130px; padding:24px; text-decoration:none; text-align:center;">
    <strong style="font-size:1.5rem;">アンケート管理</strong>
  </a>
  <a class="card" href="{{ url_for('analytics_page') }}" style="display:flex; align-items:center; justify-content:center; min-height:130px; padding:24px; text-decoration:none; text-align:center;">
    <strong style="font-size:1.5rem;">アクセス解析</strong>
  </a>
</div>
{% endblock %}
