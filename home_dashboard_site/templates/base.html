<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">

  <!-- サイト共通アイコン（ブラウザのタブ・ブックマーク） -->
  <link
    rel="icon"
    type="image/png"
    href="{{ url_for('static', filename='site-icon.png') }}"
  >

  <!-- iPhone/iPadで「ホーム画面に追加」したときだけ別の画像を使用 -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="{{ url_for('static', filename='apple-touch-icon.png') }}"
  >

  <title>{% block title %}迷言{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* テーマ切り替えアイコンをボタンの中央に配置 */
    #themeToggle { display: inline-flex; align-items: center; justify-content: center; }
    #themeToggle #themeIcon { display: block; flex: 0 0 auto; margin: 0 auto; object-fit: contain; }
  </style>
</head>

<body
  data-weather-place="{{ weather_place|default('sano') }}"
  data-appearance="{{ appearance|default('system') }}"
>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">
      <img
        class="brand-mark custom-icon"
        src="{{ url_for('static', filename='icons/home-top.png') }}"
        alt=""
      >
      <span>迷言</span>
    </a>

    <div class="top-actions">
      <a
        class="operation-top-link"
        id="operationTopLink"
        href="{{ url_for('operation_page') }}"
        aria-label="運行情報"
      >
        <img
          class="operation-top-icon custom-icon"
          src="{{ url_for('static', filename='icons/operation.png') }}"
          alt=""
        >
        <span class="operation-top-label">
          {{ railway_label|default('運行情報') }}
        </span>
        <span id="operationStatusText" class="operation-status-text">
          取得中…
        </span>
      </a>
<a
        class="settings-top-link"
        href="{{ url_for('settings') }}"
        aria-label="設定"
        title="設定"
      >
        <img
          class="custom-icon header-settings-icon"
          src="{{ url_for('static', filename='icons/settings.png') }}"
          alt=""
        >
      </a>

      <button
        class="icon-button"
        id="themeToggle"
        aria-label="テーマ切り替え"
        title="ライト・ダーク切り替え"
      >
        <img
          id="themeIcon"
          class="theme-icon"
          src="{{ url_for('static', filename='icons/theme-dark.png') }}"
          alt=""
        >
      </button>
    </div>
  </header>

  <main class="page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <section aria-live="polite" style="margin:0 0 12px;">
          {% for category, message in messages %}
            <div style="padding:10px 12px;margin:6px 0;border-radius:10px;background:rgba(127,127,127,.14);">{{ message }}</div>
          {% endfor %}
        </section>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <nav class="bottom-nav" aria-label="メインメニュー">
    <a
      class="nav-item"
      data-nav-key="home"
      href="{{ url_for('home') }}"
    >
      <img class="nav-icon custom-icon" src="" alt="">
      <span>ホーム</span>
    </a>

    <a
      class="nav-item"
      data-nav-key="operation"
      href="{{ url_for('operation_page') }}"
    >
      <img class="nav-icon custom-icon" src="" alt="">
      <span>時刻表</span>
    </a>

    <a
      class="nav-item"
      data-nav-key="calendar"
      href="{{ url_for('calendar_page') }}"
    >
      <img class="nav-icon custom-icon" src="" alt="">
      <span>カレンダー</span>
    </a>

    <a
      class="nav-item"
      data-nav-key="schedule"
      href="{{ url_for('schedule') }}"
    >
      <img class="nav-icon custom-icon" src="" alt="">
      <span>時間割</span>
    </a>

    <a
      class="nav-item"
      data-nav-key="more"
      href="{{ url_for('more_page') }}"
    >
      <img class="nav-icon custom-icon" src="" alt="">
      <span>その他</span>
    </a>
  </nav>

  <script>
    /* ホーム画面に追加したiPhoneアプリとして開いている場合だけ識別 */
    (function () {
      const isStandalone =
        window.matchMedia('(display-mode: standalone)').matches ||
        window.matchMedia('(display-mode: fullscreen)').matches ||
        window.navigator.standalone === true;

      if (isStandalone) {
        document.body.classList.add('app-standalone');
      }
    })();
  </script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
