{% extends "base.html" %}
{% block title %}迷言｜その他{% endblock %}
{% block content %}
<section class="welcome-row">
  <div><h1>その他</h1></div>
</section>
<section class="more-tools-section">
  <div class="more-tools-grid">
    {% set icon_theme = 'light' if appearance == 'light' else 'dark' %}
    <a class="card more-tool-card" href="{{ url_for('roster_page') }}">
      <img class="more-tool-icon custom-icon" src="{{ url_for('static', filename='icons/' ~ icon_theme ~ '/roster.png') }}" alt="">
      <strong>名簿</strong>
    </a>
    <a class="card more-tool-card" href="{{ url_for('range_page') }}">
      <img class="more-tool-icon custom-icon" src="{{ url_for('static', filename='icons/' ~ icon_theme ~ '/range.png') }}" alt="">
      <strong>定期試験範囲表</strong>
    </a>
    <a class="card more-tool-card" href="{{ url_for('quiz_page') }}">
      <img class="more-tool-icon custom-icon" src="{{ url_for('static', filename='icons/' ~ icon_theme ~ '/quiz.png') }}" alt="">
      <strong>クイズ</strong>
    </a>
    <a class="card more-tool-card" href="{{ url_for('calculator_page') }}">
      <img class="more-tool-icon custom-icon" src="{{ url_for('static', filename='icons/' ~ icon_theme ~ '/calculator.png') }}" alt="">
      <strong>電卓</strong>
    </a>
    <a class="card more-tool-card" href="{{ url_for('recording_page') }}">
      <img class="more-tool-icon custom-icon" src="{{ url_for('static', filename='icons/' ~ icon_theme ~ '/recording.png') }}" alt="">
      <strong>録音</strong>
    </a>
    <a class="card more-tool-card" href="{{ url_for('stamp_page') }}">
      <img class="more-tool-icon custom-icon" src="{{ url_for('static', filename='icons/' ~ icon_theme ~ '/stamp.png') }}" alt="">
      <strong>スタンプ</strong>
    </a>
    <a class="card more-tool-card" href="{{ url_for('form_page') }}">
      <img class="more-tool-icon custom-icon" src="{{ url_for('static', filename='icons/' ~ icon_theme ~ '/form.png') }}" alt="">
      <strong>問い合わせ</strong>
    </a>
    <a class="card more-tool-card" href="{{ url_for('line_page') }}">
      <img class="more-tool-icon custom-icon" src="{{ url_for('static', filename='icons/' ~ icon_theme ~ '/line.png') }}" alt="">
      <strong>公式LINE</strong>
    </a>
    <a class="card more-tool-card" href="{{ url_for('video_page') }}">
      <img class="more-tool-icon custom-icon" src="{{ url_for('static', filename='icons/' ~ icon_theme ~ '/video.png') }}" alt="">
      <strong>YouTube</strong>
    </a>
    <a class="card more-tool-card" href="{{ url_for('database_page') }}">
      <img class="more-tool-icon custom-icon" src="{{ url_for('static', filename='icons/' ~ icon_theme ~ '/database.png') }}" alt="">
      <strong>データベース</strong>
    </a>
    <a class="card more-tool-card" href="{{ url_for('map_page') }}">
      <img class="more-tool-icon custom-icon" src="{{ url_for('static', filename='icons/' ~ icon_theme ~ '/map.png') }}" alt="">
      <strong>地図</strong>
    </a>
  </div>
</section>
{% endblock %}
